        :root[data-theme="dark"] { color-scheme: dark; --surface: #182234; --canvas: #0e1421; --ink: #f3f6ff; --muted: #bac7db; --line: #2a3850; --blue: #83a9ff; --blue-soft: #243959; }

    <script>
    (() => {
        'use strict';
        const STORAGE_KEY = 'dictionary_workspace_lists_v1';
        const DATABASE_NAME = 'dictionary_workspace_archive_v1';
        const WIDTH_KEY = 'dictionary_workspace_width_v1';
        const SORT_KEY = 'dictionary_workspace_sort_v1';
        const VIEW_KEY = 'dictionary_workspace_view_v1';
        const HEADER_KEY = 'dictionary_workspace_header_v1';
        const CONTROLS_KEY = 'dictionary_workspace_controls_v1';
        const NOTES_KEY = 'dictionary_workspace_hide_notes_v1';
        const FILE_FAVORITES_KEY = 'dictionary_workspace_file_favorites_v1';
        const VOCAB_LIST_ID = WorkspaceSyncCore.VOCAB_LIST_ID;
        const CHANNEL = 'dictionary-workspace-v1';
        const fileMode = location.protocol === 'file:';
        const $ = id => document.getElementById(id);
        const state = { lists: [], deleted: { lists: [], entries: [] }, selected: '', filter: 'all', sort: 'original', view: 'split', splitPercent: 40, headerCollapsed: false, controlsCollapsed: false, hideNotes: false, active: '', menuIndex: -1,
            frameReady: false, pendingQuery: '', fileFavorites: Object.create(null), batchSelecting: false, selectedVocabularyIds: new Set() };
        let toastTimer, pressTimer, pressStart, suppressClick = false;
        let archiveDb = null;
        let archiveKey = 'workspace';
        let saveQueue = Promise.resolve(true);
        let visibleRows = [], renderedRows = 0, lastRenderedGroup = null;
        let vocabularyKeys = new Set();
        const shuffleRanks = new Map();
        let loadObserver;
        const newId = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;

        function notify(message) {
            $('toast').textContent = message;
            $('toast').classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 3200);
        }

        function currentList() { return state.lists.find(list => list.id === state.selected); }
        function vocabularyList() { return state.lists.find(list => list.id === VOCAB_LIST_ID); }
        function isVocabularyList(list) { return list?.id === VOCAB_LIST_ID; }
        function ensureVocabularyList() {
            const snapshot = { lists: state.lists, deleted: state.deleted, selected: state.selected };
            const result = WorkspaceSyncCore.ensureVocabularyList(snapshot);
            state.lists = snapshot.lists; state.deleted = snapshot.deleted; state.selected = snapshot.selected;
            return result.changed;
        }
        function openArchive() {
            if (!window.indexedDB) return Promise.resolve(null);
            return new Promise(resolve => {
                try {
                    const request = indexedDB.open(DATABASE_NAME, 1);
                    request.onupgradeneeded = () => request.result.createObjectStore('snapshots');
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => resolve(null);
                    request.onblocked = () => resolve(null);
                } catch { resolve(null); }
            });
        }
        function archiveRequest(mode, value, key = archiveKey) {
            return new Promise((resolve, reject) => {
                const transaction = archiveDb.transaction('snapshots', mode);
                const request = mode === 'readonly'
                    ? transaction.objectStore('snapshots').get(key)
                    : transaction.objectStore('snapshots').put(value, key);
                request.onerror = () => reject(request.error);
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error || new Error('本地事务已中止'));
                transaction.oncomplete = () => resolve(request.result);
            });
        }
        const storageKey = key => key === 'workspace' ? STORAGE_KEY : `${STORAGE_KEY}_${key}`;
        async function readArchive(key) {
            if (archiveDb) {
                try {
                    const value = await archiveRequest('readonly', undefined, key);
                    if (value) return value;
                } catch { /* Use localStorage fallback. */ }
            }
            try { return JSON.parse(localStorage.getItem(storageKey(key)) || '{}'); }
            catch { return {}; }
        }
        function save(touch = true) {
            const list = currentList();
            if (list && touch) list.updatedAt = Date.now();
            const snapshot = { schemaVersion: 1, lists: state.lists, deleted: state.deleted, selected: state.selected };
            const copy = structuredClone(snapshot);
            const key = archiveKey;
            saveQueue = saveQueue.catch(() => false).then(async () => {
                try {
                    if (archiveDb) await archiveRequest('readwrite', copy, key);
                    else localStorage.setItem(storageKey(key), JSON.stringify(copy));
                    return true;
                } catch {
                    notify('本地存储空间不足，词表尚未存档，请立即导出备份');
                    return false;
                }
            });
            if (touch) window.dispatchEvent(new CustomEvent('wordlist:changed', { detail: { listId: state.selected, updatedAt: Date.now() } }));
            return saveQueue;
        }
        async function load() {
            archiveDb = await openArchive();
            let migrated = false;
            try {
                const stored = await readArchive('workspace');
                if (archiveDb && Array.isArray(stored.lists) && localStorage.getItem(STORAGE_KEY)) {
                    try {
                        await archiveRequest('readwrite', stored, 'workspace');
                        localStorage.removeItem(STORAGE_KEY);
                    } catch { archiveDb = null; }
                }
                if (Array.isArray(stored.lists)) {
                    state.lists = stored.lists.filter(list => list && typeof list.id === 'string' && Array.isArray(list.entries));
                    state.selected = stored.selected || state.lists[0]?.id || '';
                }
                if (stored.deleted && Array.isArray(stored.deleted.lists) && Array.isArray(stored.deleted.entries)) state.deleted = stored.deleted;
                const now = Date.now();
                for (const list of state.lists) {
                    if (!list.updatedAt) { list.updatedAt = now; migrated = true; }
                    if (!list.nameUpdatedAt) { list.nameUpdatedAt = list.updatedAt; migrated = true; }
                    if (!list.createdAt) { list.createdAt = list.updatedAt; migrated = true; }
                    for (const [index, entry] of list.entries.entries()) {
                        if (!entry.id) { entry.id = newId(); migrated = true; }
                        if (!entry.createdAt) { entry.createdAt = now; entry.updatedAt = now; migrated = true; }
                        if (!entry.updatedAt) { entry.updatedAt = entry.createdAt; migrated = true; }
                        if (entry.order === undefined) { entry.order = index; migrated = true; }
                    }

            if (!entry) return;
            if (fileMode) {
                if (!state.frameReady) { notify('右侧页面仍在加载，请稍后收藏'); return; }
                const word = favoriteKey(entry.word);
                postToFrame('set-favorite', { word, desired: !isFavorite(word, favorites()) });
                closeMenu();
                return;
            }
            const frame = frameWindow();
            if (!frame || typeof frame.toggleFavoriteWord !== 'function') {
                notify('右侧解析页尚未就绪，暂时无法收藏'); return;
            }
            const word = favoriteKey(entry.word);
            const wasSaved = frame.hasFavorite(word);
            frame.toggleFavoriteWord(word);
            notify(wasSaved ? `已取消收藏 ${entry.word}` : `已收藏 ${entry.word}`);
            closeMenu(); render();
        }
        function toggleMark() {
            const entry = currentList()?.entries[state.menuIndex];
            if (!entry) return;
            entry.marked = !entry.marked;
            entry.updatedAt = Date.now();
            save();
            notify(entry.marked ? `已标记 ${entry.word}` : `已取消标记 ${entry.word}`);
            closeMenu(); render();
        }

        function deleteEntry() {
            const list = currentList();
            const index = state.menuIndex;
            const entry = list?.entries[index];
            if (!entry || !confirm(`从当前词表删除“${entry.word}”？`)) return;
            state.deleted.entries.push({ listId: list.id, entryId: entry.id, deletedAt: Date.now() });
            list.entries.splice(index, 1);
            save(); refreshPicker(); closeMenu(); render(); notify(`已从词表删除 ${entry.word}`);
        }

        function openRenameList() {
            const list = currentList();
            if (!list) return;
            setListPopover(false);
            $('renameListInput').value = list.name;
            $('renameListDialog').showModal();
            $('renameListInput').focus();
            $('renameListInput').select();
        }

        function renameList(event) {
            event.preventDefault();
            const list = currentList();
            if (!list) return;
            const next = $('renameListInput').value.trim().slice(0, 80);
            if (!next) { notify('请输入词表名称'); return; }
            if (state.lists.some(other => other !== list && other.name === next)) {
                notify('已有同名词表'); return;
            }
            list.name = next;
            list.nameUpdatedAt = Date.now();
            save(); refreshPicker();
            $('renameListDialog').close();
            notify(`词表已重命名为 ${next}`);
        }

        function downloadExport(type) {
            const list = currentList();
            if (!list) { notify('请先创建或导入词表'); return; }
            try {
                const options = { includeVocabularyHistory: isVocabularyList(list) };
                const data = type === 'csv' ? WordList.exportCsv(list.entries, favorites(), options)
                    : WordList.exportXlsx(list.entries, favorites(), options);
                const mime = type === 'csv' ? 'text/csv;charset=utf-8'
                    : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                const url = URL.createObjectURL(new Blob([data], { type: mime }));
                const link = document.createElement('a');
                link.href = url;
                link.download = `${list.name.replace(/\.(xlsx|csv|txt)$/i, '').replace(/[\\/:*?"<>|]/g, '_') || '单词表'}.${type}`;
                document.body.append(link); link.click(); link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                notify(`已导出 ${list.entries.length} 个词条`);
            } catch (error) { notify(`导出失败：${error.message}`); }
        }

        function backupArchive() {
            const snapshot = window.WordlistWorkspace?.getSnapshot();
            if (!snapshot?.lists.length) { notify('没有可备份的词表'); return; }
            const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot)], { type: 'application/json' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = `多彩词表存档-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.append(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            notify(`已备份 ${snapshot.lists.length} 份处理后的词表`);
        }

        async function restoreArchive(file) {
            if (!file) return;
            try {
                if (file.size > 30 * 1024 * 1024) throw new Error('存档超过 30 MB');
                const snapshot = JSON.parse(await file.text());
                if (snapshot?.schemaVersion !== 1 || !Array.isArray(snapshot.lists) ||
                    !snapshot.lists.every(list => typeof list.id === 'string' && typeof list.name === 'string' &&
                        Array.isArray(list.entries) && list.entries.every(entry => typeof entry.id === 'string' && typeof entry.word === 'string')))
                    throw new Error('不是有效的词表存档');
                const count = snapshot.lists.reduce((sum, list) => sum + list.entries.length, 0);
                if (count > 100000) throw new Error('存档超过 100000 个词条');
                const before = window.WordlistWorkspace.getSnapshot();
                const merged = WorkspaceSyncCore.unpack(
                    WorkspaceSyncCore.mergePacked(WorkspaceSyncCore.pack(before), WorkspaceSyncCore.pack(snapshot)),
                    before.selected || snapshot.selected);
                const saved = await window.WordlistWorkspace.applySnapshot(merged);
                if (!saved) throw new Error('本地存档失败，请先导出备份');
                window.dispatchEvent(new CustomEvent('wordlist:changed'));
                notify(`已导入旧存档：${snapshot.lists.length} 份词表、${count} 个词条`);
            } catch (error) { notify(`导入存档失败：${error.message}`); }
            finally { $('archiveInput').value = ''; }
        }

        async function importFiles(files) {
            let imported = 0, importedEntries = 0;
            for (const file of files) {
                try {
                    const entries = await WordList.parseFile(file);
                    const id = newId();
                    const now = Date.now();
                    state.lists.push({ id, name: file.name, createdAt: now, nameUpdatedAt: now, updatedAt: now,
                        entries: entries.map((entry, index) => ({ ...entry, id: newId(), order: index, createdAt: now, updatedAt: now })) });
                    state.selected = id;
                    imported++; importedEntries += entries.length;
                } catch (error) { notify(`${file.name}：${error.message}`); }
            }
            if (imported) {
                const persisted = await save(); refreshPicker(); setHeaderCollapsed(true); setControlsCollapsed(true); render(true);
                requestFavorites();
                notify(persisted ? `已导入并保存 ${imported} 份单词表，共 ${importedEntries} 个去重词条` : '词表已显示但未存档，请立即导出备份');
            }
            $('fileInput').value = '';
        }

        function installEvents() {
            document.querySelectorAll('.modebar [data-view]').forEach(button =>
                button.addEventListener('click', () => setView(button.dataset.view)));
            $('headerToggle').addEventListener('click', () => setHeaderCollapsed(!state.headerCollapsed));
            $('controlsToggle').addEventListener('click', () => setControlsCollapsed(!state.controlsCollapsed));
            $('listQuickToggle').addEventListener('click', () => setListPopover(!$('listPopover').classList.contains('open')));
            $('specialListShortcut').addEventListener('click', () => selectList(VOCAB_LIST_ID));
            $('noteToggle').addEventListener('click', () => setHideNotes(!state.hideNotes));
            $('importButton').addEventListener('click', () => $('fileInput').click());
            $('fileInput').addEventListener('change', event => importFiles(Array.from(event.target.files)));
            $('newListButton').addEventListener('click', () => {
                const name = prompt('新词表名称', `新词表 ${state.lists.length + 1}`)?.trim();
                if (!name) return;
                const now = Date.now();
                const list = { id: newId(), name: name.slice(0, 80), entries: [], createdAt: now, nameUpdatedAt: now, updatedAt: now };
                state.lists.push(list); state.selected = list.id;
                save(); refreshPicker(); setHeaderCollapsed(true); setControlsCollapsed(false); render(true);
            });
            $('addWordButton').addEventListener('click', () => {
                $('addForm').classList.toggle('open');
                $('addForm').inert = !$('addForm').classList.contains('open');
                $('addWordButton').setAttribute('aria-expanded', String($('addForm').classList.contains('open')));
                if ($('addForm').classList.contains('open')) $('newWord').focus();
            });
            $('addForm').addEventListener('submit', event => {
                event.preventDefault();
                if (addEntry($('newWord').value, $('newNote').value)) {
                    $('addForm').reset(); $('newWord').focus(); notify('词条已加入当前词表');
                }
            });
            $('exportCsvButton').addEventListener('click', () => downloadExport('csv'));
            $('exportXlsxButton').addEventListener('click', () => downloadExport('xlsx'));
            $('vocabExportButton').addEventListener('click', () => downloadExport('csv'));
            $('backupArchiveButton').addEventListener('click', backupArchive);
            $('restoreArchiveButton').addEventListener('click', () => $('archiveInput').click());
            $('archiveInput').addEventListener('change', event => void restoreArchive(event.target.files[0]));
            $('cleanListButton').addEventListener('click', () => {
                const list = currentList();
                if (!list) { notify('请先选择词表'); return; }
                if (isVocabularyList(list)) { notify('专属生词表不需要清理标题'); return; }
                const kept = WordList.filterEntries(list.entries);
                const removed = list.entries.filter(entry => !kept.includes(entry));
                if (!removed.length) { notify('没有发现疑似标题'); return; }
                if (!confirm(`发现 ${removed.length} 个疑似标题或非词条，例如“${removed.slice(0, 3).map(entry => entry.word).join('、')}”。从当前词表移除？`)) return;
                removed.forEach(entry => state.deleted.entries.push({ listId: list.id, entryId: entry.id, deletedAt: Date.now() }));
                list.entries = kept;
                save(); refreshPicker(); render(); notify(`已清理 ${removed.length} 个疑似标题`);
            });
            $('sampleButton').addEventListener('click', () => {
                const entries = WordList.parseTxt('# 示例词表\n1. serendipity — 意外发现美好事物的能力\n2. resilient — 有韧性的\n3. in a nutshell — 简言之', '示例');
                const id = `sample-${Date.now()}`;
                const now = Date.now();
                state.lists.push({ id, name: '示例词表', createdAt: now, nameUpdatedAt: now, updatedAt: now,
                    entries: entries.map((entry, index) => ({ ...entry, id: newId(), order: index, createdAt: now, updatedAt: now })) }); state.selected = id;
                save(); refreshPicker(); setHeaderCollapsed(true); setControlsCollapsed(true); render(true); requestFavorites(); notify('已加载示例词表');
            });
            $('listSelect').addEventListener('change', event => selectList(event.target.value));
            $('renameListButton').addEventListener('click', openRenameList);
            $('renameListForm').addEventListener('submit', renameList);
            $('cancelRenameList').addEventListener('click', () => $('renameListDialog').close());
            $('deleteButton').addEventListener('click', () => {
                const list = currentList();
                if (isVocabularyList(list)) { notify('专属生词表不能删除'); return; }
                if (!list || !confirm(`删除单词表“${list.name}”？此操作不会删除右侧的收藏或查询缓存。`)) return;
                state.deleted.lists.push({ listId: list.id, deletedAt: Date.now() });
                state.lists = state.lists.filter(item => item.id !== list.id);
                state.selected = state.lists[0]?.id || ''; state.active = '';
                save(); refreshPicker(); render(true); setListPopover(false); notify('已删除单词表');
            });
            $('filterInput').addEventListener('input', () => {
                if (state.batchSelecting) state.selectedVocabularyIds.clear();
                render(true);
                showFirstVisibleEntry();
            });
            $('batchModeToggle').addEventListener('click', () => {
                state.batchSelecting = true; state.selectedVocabularyIds.clear(); render();
            });
            $('batchCancel').addEventListener('click', endBatchSelection);
            $('batchDelete').addEventListener('click', deleteSelectedVocabulary);
            $('batchSelectAll').addEventListener('change', event => {
                visibleRows.forEach(({ entry }) => {
                    if (event.target.checked) state.selectedVocabularyIds.add(entry.id);
                    else state.selectedVocabularyIds.delete(entry.id);
                });
                $('entries').querySelectorAll('.entry-select').forEach(input => { input.checked = event.target.checked; });
                updateBatchBar();
            });
            $('closeRecordDialog').addEventListener('click', () => $('recordDialog').close());
            $('sortSelect').addEventListener('change', event => {
                state.sort = event.target.value;
                localStorage.setItem(SORT_KEY, state.sort);
                if (state.sort === 'random') shuffleRanks.delete(currentList()?.id);
                render(true);
                showFirstVisibleEntry();
            });
            $('shuffleButton').addEventListener('click', () => {
                state.sort = 'random';
                localStorage.setItem(SORT_KEY, state.sort);
                shuffleRanks.delete(currentList()?.id);
                $('sortSelect').value = state.sort;
                render(true);
                showFirstVisibleEntry();
            });
            document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
                state.filter = button.dataset.filter;
                if (state.batchSelecting) state.selectedVocabularyIds.clear();
                document.querySelectorAll('.filter').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
                render(true);
                showFirstVisibleEntry();
            }));
            $('entries').addEventListener('click', event => {
                const row = event.target.closest('.entry');
                if (!row) return;
                if (event.target.closest('.entry-select')) {
                    const input = event.target.closest('.entry-select');
                    toggleVocabularySelection(input.value, input.checked);
                    return;
                }
                if (event.target.closest('.row-vocab-action')) {
                    const index = Number(row.dataset.index);
                    const list = currentList();
                    if (isVocabularyList(list)) openVocabularyRecord(index);
                    else if (list?.entries[index]) {
                        const entry = list.entries[index];
                        if (vocabularyKeys.has(favoriteKey(entry.word))) removeFromVocabulary(entry.word);
                        else addToVocabulary(entry, list);
                    }
                    return;
                }
                if (event.target.closest('.more-button')) { openMenu(Number(row.dataset.index), event.target.closest('button')); return; }
                if (!event.target.closest('.word-button')) return;
                const selection = window.getSelection();
                if (selection && !selection.isCollapsed && event.target.closest('.word-button').contains(selection.anchorNode)) return;
                if (suppressClick) { suppressClick = false; return; }
                if (state.batchSelecting && isVocabularyList(currentList())) {
                    const id = currentList().entries[Number(row.dataset.index)]?.id;
                    if (id) toggleVocabularySelection(id, !state.selectedVocabularyIds.has(id));
                    return;
                }
                query(Number(row.dataset.index));
            });
            $('entries').addEventListener('keydown', event => {
                const button = event.target.closest('.word-button');
                if (!button || (event.key !== 'Enter' && event.key !== ' ')) return;
                event.preventDefault();
                const index = Number(button.closest('.entry').dataset.index);
                if (state.batchSelecting && isVocabularyList(currentList())) {
                    const id = currentList().entries[index]?.id;
                    if (id) toggleVocabularySelection(id, !state.selectedVocabularyIds.has(id));
                } else query(index);
            });
            $('entries').addEventListener('pointerdown', event => {
                const button = event.target.closest('.word-button');
                if (!button || event.pointerType === 'mouse') return;
                const row = button.closest('.entry');
                pressStart = { x: event.clientX, y: event.clientY };
                clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    suppressClick = true;
                    setTimeout(() => { suppressClick = false; }, 300);
                    openMenu(Number(row.dataset.index), button);
                }, 550);
            });
            $('entries').addEventListener('pointermove', event => {
                if (pressStart && Math.hypot(event.clientX - pressStart.x, event.clientY - pressStart.y) > 12) clearTimeout(pressTimer);
            });
            for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
                $('entries').addEventListener(type, () => { clearTimeout(pressTimer); pressStart = null; });
            }
            $('entries').addEventListener('contextmenu', event => {
                const row = event.target.closest('.entry');
                if (!row) return;
                if (window.getSelection()?.toString().trim()) return;
                event.preventDefault(); clearTimeout(pressTimer);
                openMenu(Number(row.dataset.index), row);
            });
            $('menuFavorite').addEventListener('click', toggleFavorite);
            $('menuMark').addEventListener('click', toggleMark);
            $('menuDelete').addEventListener('click', deleteEntry);
            document.addEventListener('pointerdown', event => {
                if (!event.target.closest('#actionMenu, .more-button, .word-button')) closeMenu();
                if (!event.target.closest('.list-picker')) setListPopover(false);
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') { closeMenu(); setListPopover(false); }
            });
            window.addEventListener('storage', event => {
                if (event.key === 'color_theme_v5') document.documentElement.dataset.theme = event.newValue === 'dark' ? 'dark' : 'light';
                if (fileMode || event.key !== 'word_favorites_v10') return;
                render();
            });
            window.addEventListener('message', event => {
                if (!fileMode || event.source !== $('dictionaryFrame').contentWindow || event.data?.channel !== CHANNEL) return;
                const message = event.data;
                if (message.type === 'ready') {
                    state.frameReady = true;
                    requestFavorites();
                    if (state.pendingQuery) {
                        postToFrame('query', { word: state.pendingQuery });
                        state.pendingQuery = '';
                    }
                } else if (message.type === 'favorites' && Array.isArray(message.entries)) {
                    for (const [word, saved] of message.entries) {
                        if (saved) state.fileFavorites[word] = true;
                        else delete state.fileFavorites[word];
                    }
                    localStorage.setItem(FILE_FAVORITES_KEY, JSON.stringify(state.fileFavorites));
                    render();
                } else if (message.type === 'favorite-state' && typeof message.word === 'string') {
                    if (message.saved) state.fileFavorites[message.word] = true;
                    else delete state.fileFavorites[message.word];
                    localStorage.setItem(FILE_FAVORITES_KEY, JSON.stringify(state.fileFavorites));
                    notify(message.saved ? `已收藏 ${message.word}` : `已取消收藏 ${message.word}`);
                    render();
                } else if (message.type === 'error') notify(message.text || '右侧操作失败');
            });
            $('dictionaryFrame').addEventListener('load', () => {
                try {
                    const frameRoot = $('dictionaryFrame').contentDocument.documentElement;
                    const syncTheme = () => {
                        document.documentElement.dataset.theme = frameRoot.dataset.theme === 'dark' ? 'dark' : 'light';
                    };
                    syncTheme();
                    new MutationObserver(syncTheme).observe(frameRoot, { attributes: true, attributeFilter: ['data-theme'] });
                } catch { /* The query page may be in another origin. */ }
                if (!fileMode) { state.frameReady = true; render(); }
                else setTimeout(() => {
                    if (!state.frameReady) notify('本地右侧页面没有响应；请用 npm start 打开本地服务再试');
                }, 1000);
            });
            const library = $('library');
            library.addEventListener('pointerenter', requestFavorites);
            library.addEventListener('dragover', event => { event.preventDefault(); library.classList.add('dragging'); });
            library.addEventListener('dragleave', event => { if (!library.contains(event.relatedTarget)) library.classList.remove('dragging'); });
            library.addEventListener('drop', event => {
                event.preventDefault(); library.classList.remove('dragging');
                if (event.dataTransfer.files.length) importFiles(Array.from(event.dataTransfer.files));
            });
            const divider = $('divider');
            const workspace = $('workspace');
            let dragging = false;
            divider.addEventListener('pointerdown', event => {
                if (event.button !== 0 || state.view !== 'split') return;
                event.preventDefault();
                dragging = true;
                workspace.classList.add('resizing');
                divider.setPointerCapture(event.pointerId);
            });
            divider.addEventListener('pointermove', event => {
                if (!dragging) return;
                const rect = workspace.getBoundingClientRect();
                const percent = Math.max(0, Math.min(100, (event.clientX - rect.left) / rect.width * 100));
                workspace.style.setProperty('--left-width', `calc(${percent}% - ${8 * percent / 100}px)`);
                divider.setAttribute('aria-valuenow', String(Math.round(percent)));
            });
            const finishResize = event => {
                if (!dragging) return;
                dragging = false;
                if (divider.hasPointerCapture(event.pointerId)) divider.releasePointerCapture(event.pointerId);
                if (event.type === 'pointercancel') {
                    workspace.classList.remove('resizing');
                    setView('split');
                    return;
                }
                const rect = workspace.getBoundingClientRect();
                const percent = Math.max(0, Math.min(100, (event.clientX - rect.left) / rect.width * 100));
                workspace.classList.remove('resizing');
                if (percent <= 1.5) setView('dictionary');
                else if (percent >= 98.5) setView('list');
                else {
                    state.splitPercent = percent;
                    localStorage.setItem(WIDTH_KEY, `${percent}%`);
                    setView('split');
                }
            };
            divider.addEventListener('pointerup', finishResize);
            divider.addEventListener('pointercancel', finishResize);
            divider.addEventListener('keydown', event => {
                if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
                event.preventDefault();
                const step = event.shiftKey ? 10 : 2;
                const next = event.key === 'Home' ? 0 : event.key === 'End' ? 100
                    : Math.max(0, Math.min(100, state.splitPercent + (event.key === 'ArrowRight' ? step : -step)));
                if (next === 0 || next === 100) {
                    const view = next === 0 ? 'dictionary' : 'list';
                    setView(view);
                    document.querySelector(`.modebar [data-view="${view}"]`).focus();
                }
                else {
                    state.splitPercent = next;
                    localStorage.setItem(WIDTH_KEY, `${next}%`);
                    setView('split');
                }
            });
        }

        async function initialize() {
        loadObserver = new IntersectionObserver(entries => {
            if (entries.some(entry => entry.isIntersecting)) appendMore();
        }, { root: $('library'), rootMargin: '350px' });
        await load();
        window.WordlistWorkspace = {
            getSnapshot: () => structuredClone({ schemaVersion: 1, lists: state.lists, deleted: state.deleted, selected: state.selected }),
            readArchive,
            async writeArchive(key, snapshot) {
                if (archiveDb) await archiveRequest('readwrite', structuredClone(snapshot), key);
                else localStorage.setItem(storageKey(key), JSON.stringify(snapshot));
            },
            async activateArchive(key, seed) {
                await saveQueue.catch(() => false);
                const stored = await readArchive(key);
                archiveKey = key;
                const snapshot = Array.isArray(stored.lists) ? stored
                    : Array.isArray(seed?.lists) ? seed : WorkspaceSyncCore.empty();
                return window.WordlistWorkspace.applySnapshot(snapshot);
            },
            subscribe: callback => {
                const listener = () => callback(window.WordlistWorkspace.getSnapshot());
                window.addEventListener('wordlist:changed', listener);
                return () => window.removeEventListener('wordlist:changed', listener);
            },
            applySnapshot: snapshot => {
                if (snapshot?.schemaVersion !== 1 || !Array.isArray(snapshot.lists)) throw new Error('不支持的词表数据格式');
                state.lists = structuredClone(snapshot.lists);
                state.deleted = snapshot.deleted && Array.isArray(snapshot.deleted.lists) && Array.isArray(snapshot.deleted.entries)
                    ? structuredClone(snapshot.deleted) : { lists: [], entries: [] };
                state.selected = state.lists.some(list => list.id === snapshot.selected) ? snapshot.selected : state.lists[0]?.id || '';
                ensureVocabularyList();
                state.batchSelecting = false; state.selectedVocabularyIds.clear();
                const persisted = save(false); refreshPicker(); render(); requestFavorites();
                return persisted;
            }
        };
        setView(state.view);
        setHeaderCollapsed(state.headerCollapsed);
        setControlsCollapsed(state.controlsCollapsed);
        observeStickyControls();
        setHideNotes(state.hideNotes);
        $('sortSelect').value = state.sort;
        $('addForm').inert = true;
        refreshPicker(); render(); installEvents();
        $('dictionaryFrame').src = 'dictionary_workspace_right.html';
        window.dispatchEvent(new Event('wordlist:ready'));
        }
        initialize().catch(error => notify(`词表初始化失败：${error.message}`));
    })();
    </script>
